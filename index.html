<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Koora Live | Real-Time Match Scores, Standings & Football News</title>
<meta name="description" content="Live football scores, standings and fixtures for the Premier League, La Liga, Serie A, Bundesliga, Ligue 1, Champions League, Saudi Pro League and more — updated every minute, free, no login required.">
<link rel="canonical" href="https://bankacem.github.io/koora-live-scores/">
<meta property="og:type" content="website">
<meta property="og:title" content="Koora Live | Real-Time Match Scores">
<meta property="og:description" content="Live football scores and standings across major world leagues, updated every minute.">
<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": "Koora Live",
  "url": "https://bankacem.github.io/koora-live-scores/"
}
</script>
</head>
<body>

<header class="site-header">
  <div class="container header-container">
    <a href="./" class="logo">⚽ KooraLive</a>
    <nav class="main-nav">
      <a href="./" aria-current="page" data-i18n="navHome">Live Scores</a>
      <a href="#news" data-i18n="navNews">News</a>
    </nav>
    <div class="lang-selector">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ar">AR</button>
      <button class="lang-btn" data-lang="fr">FR</button>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </div>
</header>

<!-- League switcher -->
<div class="league-nav-wrap">
  <div class="container">
    <nav id="league-nav" class="league-nav" aria-label="Competitions"></nav>
  </div>
</div>

<main class="container">
  <div class="controls-row">
    <div class="controls">
      <button class="btn active" id="btn-all" data-i18n="btnAll">All Matches</button>
      <button class="btn" id="btn-live" data-i18n="btnLive">Live Now <span class="pulse"></span></button>
    </div>
    <span id="updated-label" class="updated-label"></span>
  </div>

  <div id="loading-state" class="loader" data-i18n="loadingMatches">Fetching live data...</div>
  <div id="match-container" class="match-list" aria-live="polite"></div>

  <section id="standings-wrap" class="box standings-box" style="display:none;">
    <h2 data-i18n="standingsTitle">Standings</h2>
    <div id="standings-container"></div>
  </section>

  <section id="news" class="articles-section">
    <h2 class="section-title" data-i18n="navNews">News</h2>
    <div class="articles-grid" id="articles-container"></div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>&copy; <span id="year"></span> KooraLive. <span data-i18n="allRights">All rights reserved.</span></p>
  </div>
</footer>

<div id="article-modal" class="modal">
  <div class="modal-content">
    <span class="modal-close" id="modal-close-btn">&times;</span>
    <div id="modal-article-body"></div>
  </div>
</div>

<script src="assets/leagues.js"></script>
<script src="app.js"></script>
<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
