name: Probe Available Models (diagnostic, manual only)

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v4
        with:
          ref: data
          fetch-depth: 1

      - name: Probe gateway and write results to file
        env:
          GATEWAY_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          OUT="data/_diagnostics/model-probe.md"
          mkdir -p data/_diagnostics
          echo "# Model probe results ($(date -u))" > "$OUT"

          echo -e "\n## /v1/models list\n\`\`\`" >> "$OUT"
          curl -s -H "Authorization: Bearer ${GATEWAY_KEY}" \
               "https://api.bluesminds.com/v1/models" >> "$OUT" 2>&1 || echo "models list call failed" >> "$OUT"
          echo -e "\`\`\`" >> "$OUT"

          echo -e "\n## Chat completion tests\n" >> "$OUT"
          MODELS=("gpt-4o" "gpt-4o-mini" "gpt-5-mini" "gpt-5.5" "gpt-5.2-chat" "openai/gpt-oss-120b" "openai/gpt-oss-20b" "gpt-oss-20b" "deepseek-ai/deepseek-v4-flash" "deepseek-v4-flash" "meta/llama-3.3-70b-instruct" "qwen2.5" "hy3" "z-ai/glm5" "mistralai/mistral-large")
          for m in "${MODELS[@]}"; do
            echo "### $m" >> "$OUT"
            echo '```' >> "$OUT"
            HTTP_CODE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
              -X POST "https://api.bluesminds.com/v1/chat/completions" \
              -H "Authorization: Bearer ${GATEWAY_KEY}" \
              -H "Content-Type: application/json" \
              -d "{\"model\":\"$m\",\"messages\":[{\"role\":\"user\",\"content\":\"Reply with exactly: OK\"}],\"max_tokens\":10}")
            echo "HTTP status: $HTTP_CODE" >> "$OUT"
            cat /tmp/resp.json >> "$OUT"
            echo -e "\n\`\`\`\n" >> "$OUT"
          done

      - name: Commit results (safe against concurrent pushes from the main workflow)
        run: |
          git config user.name "koora-bot"
          git config user.email "koora-bot@users.noreply.github.com"
          cp -r data/_diagnostics /tmp/diag-backup

          for attempt in 1 2 3; do
            git fetch origin data
            git reset --hard origin/data
            rm -rf data/_diagnostics
            cp -r /tmp/diag-backup data/_diagnostics
            git add data/_diagnostics
            git commit -q -m "chore: model probe results" || true
            if git push origin HEAD:data; then
              echo "Pushed successfully on attempt $attempt"
              break
            else
              echo "Push failed (attempt $attempt), retrying..."
              sleep 5
            fi
          done
